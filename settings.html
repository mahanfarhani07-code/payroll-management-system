<style>

/* =====================================================
   SETTINGS 3D PREMIUM THEME
   Matte Black + Blood Red + Ocean Blue
===================================================== */

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

:root {
    --black: #050608;
    --black-2: #090b0f;
    --black-3: #0e1116;

    --panel: #12161c;
    --panel-light: #1a2028;
    --panel-dark: #0b0e12;

    --blood: #a90020;
    --blood-dark: #650012;
    --blood-light: #e21a3b;

    --ocean: #007c9f;
    --ocean-dark: #00485d;
    --ocean-light: #12c5ed;

    --cream: #eee8dc;
    --white: #f7f9fb;
    --muted: #89929d;

    --border: rgba(255,255,255,.08);
}


/* =====================================================
   BODY
===================================================== */

html {
    scroll-behavior: smooth;
}

body {
    font-family: Tahoma, Arial, sans-serif;

    min-height: 100vh;

    color: var(--white);

    background:
        radial-gradient(
            circle at 10% 10%,
            rgba(0,124,159,.18),
            transparent 30%
        ),
        radial-gradient(
            circle at 90% 20%,
            rgba(169,0,32,.15),
            transparent 28%
        ),
        radial-gradient(
            circle at 50% 100%,
            rgba(0,70,90,.12),
            transparent 35%
        ),
        linear-gradient(
            145deg,
            #030405,
            #080a0e 50%,
            #050608
        );

    background-attachment: fixed;

    overflow-x: hidden;
}


/* نورهای محیطی */

body::before {
    content: "";

    position: fixed;

    width: 450px;
    height: 450px;

    top: -220px;
    right: -170px;

    background:
        radial-gradient(
            circle,
            rgba(18,197,237,.14),
            transparent 70%
        );

    pointer-events: none;

    z-index: -1;
}

body::after {
    content: "";

    position: fixed;

    width: 420px;
    height: 420px;

    bottom: -220px;
    left: -180px;

    background:
        radial-gradient(
            circle,
            rgba(226,26,59,.12),
            transparent 70%
        );

    pointer-events: none;

    z-index: -1;
}


/* =====================================================
   HEADER
===================================================== */

.header {
    position: relative;

    padding: 40px 20px;

    text-align: center;

    background:
        linear-gradient(
            145deg,
            #07090c,
            #11161d 55%,
            #061b23
        );

    border-bottom:
        2px solid var(--ocean);

    box-shadow:
        0 20px 50px rgba(0,0,0,.65),
        inset 0 -1px 0 rgba(255,255,255,.05);

    overflow: hidden;
}


/* نور هدر */

.header::before {
    content: "";

    position: absolute;

    width: 400px;
    height: 180px;

    top: -140px;
    left: 50%;

    transform:
        translateX(-50%);

    background:
        radial-gradient(
            ellipse,
            rgba(18,197,237,.25),
            transparent 70%
        );

    pointer-events: none;
}


/* خط ترکیبی */

.header::after {
    content: "";

    position: absolute;

    bottom: 0;

    left: 8%;
    right: 8%;

    height: 2px;

    background:
        linear-gradient(
            90deg,
            transparent,
            var(--blood),
            var(--ocean-light),
            var(--blood),
            transparent
        );

    box-shadow:
        0 0 18px rgba(18,197,237,.35);
}


.header h1 {
    position: relative;

    z-index: 2;

    font-size: 30px;

    color: var(--cream);

    text-shadow:
        0 3px 0 #000,
        0 0 20px rgba(18,197,237,.22);
}


.header p {
    position: relative;

    z-index: 2;

    margin-top: 12px;

    color: var(--muted);

    font-size: 14px;

    line-height: 1.9;
}


/* =====================================================
   CONTAINER
===================================================== */

.container {
    width: 94%;

    max-width: 1200px;

    margin: 35px auto 60px;
}


/* =====================================================
   MAIN BOX
===================================================== */

.box {
    position: relative;

    padding: 30px;

    border-radius: 26px;

    background:
        linear-gradient(
            145deg,
            rgba(25,30,37,.98),
            rgba(7,9,12,.98)
        );

    border:
        1px solid rgba(255,255,255,.08);

    box-shadow:
        0 30px 80px rgba(0,0,0,.65),
        inset 0 1px 0 rgba(255,255,255,.055),
        inset 0 -1px 0 rgba(0,0,0,.8);

    overflow: hidden;
}


.box::before {
    content: "";

    position: absolute;

    top: 0;

    left: 8%;
    right: 8%;

    height: 2px;

    background:
        linear-gradient(
            90deg,
            transparent,
            var(--ocean),
            var(--ocean-light),
            var(--blood),
            transparent
        );

    box-shadow:
        0 0 20px rgba(18,197,237,.25);
}


/* =====================================================
   INFO
===================================================== */

.info {
    position: relative;

    padding: 18px 20px;

    margin-bottom: 28px;

    border-radius: 15px;

    background:
        linear-gradient(
            145deg,
            rgba(0,124,159,.16),
            rgba(10,13,17,.9)
        );

    border:
        1px solid rgba(18,197,237,.15);

    border-right:
        4px solid var(--ocean-light);

    color: var(--cream);

    line-height: 2;

    box-shadow:
        0 15px 35px rgba(0,0,0,.38),
        inset 0 1px 0 rgba(255,255,255,.04);
}


/* =====================================================
   CARDS
===================================================== */

.card {
    position: relative;

    padding: 25px;

    margin-bottom: 28px;

    border-radius: 20px;

    background:
        linear-gradient(
            145deg,
            #1b2027 0%,
            #13171d 48%,
            #090c10 100%
        );

    border:
        1px solid rgba(255,255,255,.075);

    box-shadow:
        0 22px 45px rgba(0,0,0,.52),
        0 5px 12px rgba(0,0,0,.4),
        inset 0 1px 0 rgba(255,255,255,.06),
        inset 0 -2px 0 rgba(0,0,0,.75);

    transition:
        transform .25s ease,
        box-shadow .25s ease,
        border-color .25s ease;

    overflow: hidden;
}


.card:hover {
    transform:
        translateY(-4px);

    border-color:
        rgba(18,197,237,.20);

    box-shadow:
        0 30px 60px rgba(0,0,0,.60),
        0 0 30px rgba(0,124,159,.08),
        inset 0 1px 0 rgba(255,255,255,.07);
}


/* خط سه‌بعدی */

.card::before {
    content: "";

    position: absolute;

    top: 0;

    left: 5%;
    right: 5%;

    height: 3px;

    border-radius:
        0 0 10px 10px;

    background:
        linear-gradient(
            90deg,
            transparent,
            var(--ocean),
            var(--ocean-light),
            var(--blood),
            transparent
        );

    box-shadow:
        0 0 15px rgba(18,197,237,.25);
}


/* نور گوشه */

.card::after {
    content: "";

    position: absolute;

    width: 200px;
    height: 200px;

    top: -130px;
    left: -100px;

    background:
        radial-gradient(
            circle,
            rgba(18,197,237,.08),
            transparent 70%
        );

    pointer-events: none;
}


/* =====================================================
   SECTION TITLE
===================================================== */

.section-title {
    position: relative;

    margin-bottom: 22px;

    padding-right: 15px;

    color: var(--ocean-light);

    font-size: 20px;

    text-shadow:
        0 2px 4px #000,
        0 0 16px rgba(18,197,237,.22);
}


.section-title::before {
    content: "";

    position: absolute;

    right: 0;

    top: 3px;

    width: 4px;

    height: 24px;

    border-radius: 5px;

    background:
        linear-gradient(
            var(--ocean-light),
            var(--blood-light)
        );

    box-shadow:
        0 0 12px rgba(18,197,237,.3);
}


/* =====================================================
   FORM GRID
===================================================== */

.form-grid {
    display: grid;

    grid-template-columns:
        repeat(3, 1fr);

    gap: 22px;
}


.input-group {
    display: flex;

    flex-direction: column;

    position: relative;
}


label {
    margin-bottom: 9px;

    color: #dce1e6;

    font-size: 14px;

    font-weight: bold;

    text-shadow:
        0 1px 2px #000;
}


/* =====================================================
   MONEY BOX
===================================================== */

.money-box {
    position: relative;

    display: flex;

    align-items: center;

    min-height: 55px;

    border-radius: 13px;

    background:
        linear-gradient(
            145deg,
            #080a0d,
            #181d23
        );

    border:
        1px solid #353c45;

    box-shadow:
        inset 4px 4px 9px rgba(0,0,0,.68),
        inset -2px -2px 5px rgba(255,255,255,.025),
        0 7px 16px rgba(0,0,0,.4);

    transition:
        all .25s ease;
}


.money-box:hover {
    border-color:
        rgba(18,197,237,.45);

    box-shadow:
        inset 4px 4px 9px rgba(0,0,0,.7),
        0 10px 25px rgba(0,0,0,.48),
        0 0 18px rgba(0,124,159,.10);
}


.money-box:focus-within {
    transform:
        translateY(-2px);

    border-color:
        var(--ocean-light);

    box-shadow:
        inset 4px 4px 9px rgba(0,0,0,.7),
        0 12px 28px rgba(0,0,0,.52),
        0 0 25px rgba(18,197,237,.16);
}


/* =====================================================
   MONEY INPUT
===================================================== */

.money-input {
    width: 100%;

    padding:
        15px 65px 15px 15px;

    border: none;

    outline: none;

    background:
        transparent;

    color: var(--white);

    font-family:
        Tahoma,
        Arial,
        sans-serif;

    font-size: 16px;

    font-weight: bold;

    text-align: right;

    direction: ltr;
}


.money-input::placeholder {
    color: #59636d;
}


/* =====================================================
   RIAL
===================================================== */

.money-unit {
    position: absolute;

    right: 13px;

    color:
        var(--ocean-light);

    font-size: 13px;

    font-weight: bold;

    pointer-events: none;

    text-shadow:
        0 0 9px rgba(18,197,237,.3);
}


/* =====================================================
   PRICE WORDS
===================================================== */

.price-words {
    min-height: 24px;

    margin-top: 6px;

    padding-right: 4px;

    color: #7e8994;

    font-size: 12px;

    line-height: 1.8;

    text-shadow:
        0 1px 2px #000;
}


/* =====================================================
   SMALL UNIT
===================================================== */

.unit-small {
    margin-top: 4px;

    color: #6d7781;

    font-size: 11px;
}


/* =====================================================
   NORMAL INPUT
===================================================== */

.normal-input,
select {
    width: 100%;

    padding: 14px;

    border-radius: 12px;

    border:
        1px solid #353c45;

    outline: none;

    background:
        linear-gradient(
            145deg,
            #171b20,
            #0a0d10
        );

    color: var(--white);

    font-family:
        Tahoma,
        Arial,
        sans-serif;

    box-shadow:
        inset 4px 4px 8px rgba(0,0,0,.58),
        inset -2px -2px 5px rgba(255,255,255,.025),
        0 6px 15px rgba(0,0,0,.28);

    transition:
        all .25s ease;
}


.normal-input:hover,
select:hover {
    transform:
        translateY(-1px);

    border-color:
        rgba(18,197,237,.38);
}


.normal-input:focus,
select:focus {
    transform:
        translateY(-2px);

    border-color:
        var(--ocean-light);

    box-shadow:
        inset 4px 4px 8px rgba(0,0,0,.62),
        0 10px 25px rgba(0,0,0,.45),
        0 0 20px rgba(18,197,237,.13);
}


select option {
    background:
        #11151a;

    color:
        var(--white);
}


/* =====================================================
   BUTTONS
===================================================== */

.buttons {
    display: flex;

    gap: 14px;

    margin-top: 28px;

    flex-wrap: wrap;
}


button {
    position: relative;

    border: none;

    border-radius: 13px;

    padding:
        14px 25px;

    color:
        var(--white);

    font-family:
        Tahoma,
        Arial,
        sans-serif;

    font-size: 15px;

    font-weight: bold;

    cursor: pointer;

    overflow: hidden;

    transition:
        transform .2s ease,
        box-shadow .2s ease,
        filter .2s ease;
}


button::before {
    content: "";

    position: absolute;

    top: 1px;

    left: 12%;
    right: 12%;

    height: 1px;

    background:
        rgba(255,255,255,.22);

    pointer-events: none;
}


button:hover {
    transform:
        translateY(-4px);

    filter:
        brightness(1.12);
}


button:active {
    transform:
        translateY(1px);

    box-shadow:
        inset 0 4px 9px rgba(0,0,0,.5);
}


/* =====================================================
   SAVE
===================================================== */

.save-btn {
    background:
        linear-gradient(
            145deg,
            #09a6cc,
            #006783 55%,
            #003f51
        );

    border:
        1px solid rgba(18,197,237,.5);

    box-shadow:
        0 10px 22px rgba(0,0,0,.48),
        0 0 20px rgba(0,124,159,.18),
        inset 0 1px 0 rgba(255,255,255,.18);
}


.save-btn:hover {
    box-shadow:
        0 15px 30px rgba(0,0,0,.58),
        0 0 30px rgba(18,197,237,.25),
        inset 0 1px 0 rgba(255,255,255,.20);
}


/* =====================================================
   RESET
===================================================== */

.reset-btn {
    background:
        linear-gradient(
            145deg,
            #d7193f,
            #970019 55%,
            #59000e
        );

    border:
        1px solid rgba(226,26,59,.5);

    box-shadow:
        0 10px 22px rgba(0,0,0,.48),
        0 0 20px rgba(169,0,32,.17),
        inset 0 1px 0 rgba(255,255,255,.15);
}


.reset-btn:hover {
    box-shadow:
        0 15px 30px rgba(0,0,0,.58),
        0 0 30px rgba(226,26,59,.25),
        inset 0 1px 0 rgba(255,255,255,.18);
}


/* =====================================================
   HOME
===================================================== */

.home-btn {
    background:
        linear-gradient(
            145deg,
            #373e47,
            #22272e 55%,
            #11151a
        );

    border:
        1px solid #4b5560;

    box-shadow:
        0 10px 22px rgba(0,0,0,.48),
        inset 0 1px 0 rgba(255,255,255,.10);
}


.home-btn:hover {
    box-shadow:
        0 15px 30px rgba(0,0,0,.58),
        0 0 18px rgba(255,255,255,.06);
}


/* =====================================================
   SUCCESS
===================================================== */

.success {
    display: none;

    position: relative;

    padding: 16px 18px;

    margin-top: 22px;

    border-radius: 13px;

    color:
        #c8f6ff;

    background:
        linear-gradient(
            145deg,
            rgba(0,124,159,.20),
            rgba(5,20,26,.88)
        );

    border:
        1px solid rgba(18,197,237,.20);

    border-right:
        4px solid var(--ocean-light);

    box-shadow:
        0 15px 35px rgba(0,0,0,.4),
        inset 0 1px 0 rgba(255,255,255,.05),
        0 0 20px rgba(0,124,159,.08);
}


/* =====================================================
   SCROLLBAR
===================================================== */

::-webkit-scrollbar {
    width: 10px;
}

::-webkit-scrollbar-track {
    background:
        #050608;
}

::-webkit-scrollbar-thumb {
    border-radius: 10px;

    background:
        linear-gradient(
            180deg,
            var(--ocean),
            var(--blood)
        );

    border:
        2px solid #050608;
}

::-webkit-scrollbar-thumb:hover {
    background:
        linear-gradient(
            180deg,
            var(--ocean-light),
            var(--blood-light)
        );
}


/* =====================================================
   TEXT SELECTION
===================================================== */

::selection {
    background:
        var(--blood);

    color:
        white;
}


/* =====================================================
   MOBILE
===================================================== */

@media (max-width: 900px) {

    .form-grid {
        grid-template-columns:
            repeat(2, 1fr);
    }

    .box {
        padding: 24px;
    }

    .card {
        padding: 21px;
    }
}


@media (max-width: 600px) {

    body {
        background-attachment:
            scroll;
    }

    .container {
        width: 95%;

        margin-top: 20px;
    }

    .header {
        padding:
            30px 15px;
    }

    .header h1 {
        font-size: 22px;
    }

    .header p {
        font-size: 12px;
    }

    .box {
        padding: 16px;

        border-radius: 18px;
    }

    .card {
        padding: 18px;

        border-radius: 16px;
    }

    .form-grid {
        grid-template-columns:
            1fr;

        gap: 17px;
    }

    .buttons {
        flex-direction:
            column;
    }

    button {
        width: 100%;
    }

    .section-title {
        font-size: 18px;
    }

    .money-input {
        font-size: 15px;
    }
}

</style>
