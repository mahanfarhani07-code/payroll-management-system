<style>

/* =========================================================
   3D PREMIUM THEME
   Matte Black + Blood Red + Ocean Blue
   مخصوص سیستم مدیریت حقوق و دستمزد
========================================================= */

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

:root {
    --black: #050608;
    --black-2: #090b0f;
    --black-3: #0e1116;

    --panel: #12161c;
    --panel-2: #171c23;
    --panel-3: #1d232b;

    --blood: #a90020;
    --blood-dark: #650012;
    --blood-light: #e21a3b;

    --ocean: #007c9f;
    --ocean-dark: #00485d;
    --ocean-light: #12c5ed;

    --white: #f5f7fa;
    --cream: #eee8dc;
    --muted: #89929d;

    --border: rgba(255,255,255,.08);

    --shadow-deep:
        0 25px 70px rgba(0,0,0,.65);

    --shadow-3d:
        0 15px 35px rgba(0,0,0,.55),
        inset 0 1px 0 rgba(255,255,255,.05);

    --blue-glow:
        0 0 30px rgba(0,124,159,.22);

    --red-glow:
        0 0 30px rgba(169,0,32,.22);
}


/* =========================================================
   BODY
========================================================= */

html {
    scroll-behavior: smooth;
}

body {
    font-family:
        Tahoma,
        Arial,
        sans-serif;

    min-height: 100vh;

    color: var(--white);

    background:
        radial-gradient(
            circle at 15% 10%,
            rgba(0,124,159,.20),
            transparent 28%
        ),

        radial-gradient(
            circle at 85% 20%,
            rgba(169,0,32,.16),
            transparent 27%
        ),

        radial-gradient(
            circle at 50% 100%,
            rgba(0,70,90,.12),
            transparent 35%
        ),

        linear-gradient(
            145deg,
            #030405,
            #080a0e 45%,
            #050608
        );

    background-attachment: fixed;

    overflow-x: hidden;
}


/* =========================================================
   نور تزئینی صفحه
========================================================= */

body::before {
    content: "";

    position: fixed;

    width: 420px;
    height: 420px;

    top: -180px;
    right: -160px;

    background:
        radial-gradient(
            circle,
            rgba(0,197,237,.13),
            transparent 70%
        );

    pointer-events: none;

    z-index: -1;
}

body::after {
    content: "";

    position: fixed;

    width: 380px;
    height: 380px;

    bottom: -180px;
    left: -160px;

    background:
        radial-gradient(
            circle,
            rgba(226,26,59,.12),
            transparent 70%
        );

    pointer-events: none;

    z-index: -1;
}


/* =========================================================
   HEADER
========================================================= */

.header {
    position: relative;

    padding: 42px 25px;

    text-align: center;

    background:
        linear-gradient(
            145deg,
            rgba(8,10,13,.98),
            rgba(18,23,30,.96),
            rgba(4,20,27,.98)
        );

    border-bottom:
        1px solid rgba(18,197,237,.35);

    box-shadow:
        0 20px 50px rgba(0,0,0,.55),
        inset 0 -1px 0 rgba(255,255,255,.04);

    overflow: hidden;
}


/* نور بالای هدر */

.header::before {
    content: "";

    position: absolute;

    width: 300px;
    height: 300px;

    top: -230px;
    left: 50%;

    transform:
        translateX(-50%);

    background:
        radial-gradient(
            circle,
            rgba(0,197,237,.22),
            transparent 68%
        );

    pointer-events: none;
}


/* خط قرمز و آبی */

.header::after {
    content: "";

    position: absolute;

    bottom: 0;
    left: 5%;
    right: 5%;

    height: 2px;

    background:
        linear-gradient(
            90deg,
            transparent,
            var(--blood),
            var(--ocean-light),
            var(--blood),
            transparent
        );

    box-shadow:
        0 0 18px rgba(0,197,237,.35);
}


.header h1 {
    position: relative;

    z-index: 2;

    font-size: 30px;

    color: var(--white);

    text-shadow:
        0 3px 0 #000,
        0 0 20px rgba(0,197,237,.22);

    letter-spacing: .2px;
}


.header p {
    position: relative;

    z-index: 2;

    margin-top: 12px;

    color: var(--muted);

    font-size: 14px;

    line-height: 1.9;
}


/* =========================================================
   CONTAINER
========================================================= */

.container {
    width: 94%;

    max-width: 1200px;

    margin:
        35px auto 60px;
}


/* =========================================================
   MAIN BOX
========================================================= */

.box {
    position: relative;

    padding: 30px;

    border-radius: 26px;

    background:
        linear-gradient(
            145deg,
            rgba(25,30,37,.97),
            rgba(9,11,15,.98)
        );

    border:
        1px solid rgba(255,255,255,.08);

    box-shadow:
        var(--shadow-deep),
        inset 0 1px 0 rgba(255,255,255,.05),
        inset 0 -1px 0 rgba(0,0,0,.8);

    transform:
        translateZ(0);

    overflow: hidden;
}


/* نور داخلی پنل */

.box::before {
    content: "";

    position: absolute;

    top: 0;
    left: 8%;
    right: 8%;

    height: 1px;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(18,197,237,.65),
            rgba(226,26,59,.55),
            transparent
        );

    box-shadow:
        0 0 20px rgba(18,197,237,.25);
}


/* =========================================================
   INFO
========================================================= */

.info {
    position: relative;

    padding: 18px 20px;

    margin-bottom: 28px;

    border-radius: 15px;

    background:
        linear-gradient(
            145deg,
            rgba(0,124,159,.16),
            rgba(10,13,17,.80)
        );

    border:
        1px solid rgba(0,197,237,.15);

    border-right:
        4px solid var(--ocean-light);

    color: var(--cream);

    line-height: 2;

    box-shadow:
        0 12px 30px rgba(0,0,0,.35),
        inset 0 1px 0 rgba(255,255,255,.04);

    transform:
        translateZ(0);
}


/* =========================================================
   CARD
========================================================= */

.card {
    position: relative;

    padding: 25px;

    margin-bottom: 28px;

    border-radius: 20px;

    background:
        linear-gradient(
            145deg,
            #1b2027 0%,
            #12161b 45%,
            #0b0e12 100%
        );

    border:
        1px solid rgba(255,255,255,.075);

    box-shadow:
        0 20px 40px rgba(0,0,0,.48),
        0 4px 10px rgba(0,0,0,.35),
        inset 0 1px 0 rgba(255,255,255,.06),
        inset 0 -1px 0 rgba(0,0,0,.8);

    transition:
        transform .25s ease,
        box-shadow .25s ease,
        border-color .25s ease;

    overflow: hidden;
}


/* افکت سه‌بعدی هنگام موس */

.card:hover {
    transform:
        translateY(-4px);

    border-color:
        rgba(0,197,237,.18);

    box-shadow:
        0 28px 55px rgba(0,0,0,.58),
        0 0 30px rgba(0,124,159,.08),
        inset 0 1px 0 rgba(255,255,255,.07);
}


/* خط بالایی کارت */

.card::before {
    content: "";

    position: absolute;

    top: 0;
    left: 5%;
    right: 5%;

    height: 3px;

    border-radius: 0 0 10px 10px;

    background:
        linear-gradient(
            90deg,
            transparent,
            var(--ocean),
            var(--ocean-light),
            var(--blood),
            transparent
        );

    box-shadow:
        0 0 15px rgba(0,197,237,.25);
}


/* نور گوشه */

.card::after {
    content: "";

    position: absolute;

    width: 180px;
    height: 180px;

    top: -110px;
    left: -100px;

    background:
        radial-gradient(
            circle,
            rgba(0,197,237,.09),
            transparent 70%
        );

    pointer-events: none;
}


/* =========================================================
   SECTION TITLE
========================================================= */

.section-title {
    position: relative;

    margin-bottom: 22px;

    padding-right: 15px;

    color: var(--ocean-light);

    font-size: 20px;

    text-shadow:
        0 2px 5px #000,
        0 0 16px rgba(18,197,237,.25);
}


/* خط کنار عنوان */

.section-title::before {
    content: "";

    position: absolute;

    right: 0;
    top: 4px;

    width: 4px;
    height: 22px;

    border-radius: 5px;

    background:
        linear-gradient(
            var(--ocean-light),
            var(--blood-light)
        );

    box-shadow:
        0 0 12px rgba(18,197,237,.35);
}


/* =========================================================
   FORM GRID
========================================================= */

.form-grid {
    display: grid;

    grid-template-columns:
        repeat(3, 1fr);

    gap: 22px;
}


/* =========================================================
   INPUT GROUP
========================================================= */

.input-group {
    display: flex;

    flex-direction: column;

    position: relative;
}


label {
    margin-bottom: 9px;

    color: #d8dde3;

    font-size: 14px;

    font-weight: bold;

    text-shadow:
        0 1px 2px #000;
}


/* =========================================================
   MONEY BOX
========================================================= */

.money-box {
    position: relative;

    display: flex;

    align-items: center;

    min-height: 55px;

    border-radius: 13px;

    background:
        linear-gradient(
            145deg,
            #090b0e,
            #181d23
        );

    border:
        1px solid #343b44;

    box-shadow:
        inset 3px 3px 7px rgba(0,0,0,.65),
        inset -2px -2px 5px rgba(255,255,255,.025),
        0 5px 14px rgba(0,0,0,.35);

    transition:
        all .25s ease;
}


/* برجستگی */

.money-box::before {
    content: "";

    position: absolute;

    top: 1px;
    left: 12px;
    right: 12px;

    height: 1px;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(255,255,255,.08),
            transparent
        );

    pointer-events: none;
}


.money-box:hover {
    border-color:
        rgba(18,197,237,.42);

    box-shadow:
        inset 3px 3px 8px rgba(0,0,0,.7),
        0 8px 22px rgba(0,0,0,.45),
        0 0 18px rgba(0,124,159,.08);
}


.money-box:focus-within {
    transform:
        translateY(-2px);

    border-color:
        var(--ocean-light);

    box-shadow:
        inset 3px 3px 8px rgba(0,0,0,.7),
        0 10px 28px rgba(0,0,0,.5),
        0 0 25px rgba(18,197,237,.16);
}


/* =========================================================
   MONEY INPUT
========================================================= */

.money-input {
    width: 100%;

    padding:
        15px 65px 15px 15px;

    border: none;

    outline: none;

    background:
        transparent;

    color: var(--white);

    font-family:
        Tahoma,
        Arial,
        sans-serif;

    font-size: 16px;

    font-weight: bold;

    text-align: right;

    direction: ltr;
}


.money-input::placeholder {
    color: #58616b;
}


/* =========================================================
   RIAL
========================================================= */

.money-unit {
    position: absolute;

    right: 13px;

    color:
        var(--ocean-light);

    font-size: 13px;

    font-weight: bold;

    pointer-events: none;

    text-shadow:
        0 0 8px rgba(18,197,237,.25);
}


/* =========================================================
   PRICE WORDS
========================================================= */

.price-words {
    min-height: 24px;

    margin-top: 6px;

    padding-right: 4px;

    color: #7f8994;

    font-size: 12px;

    line-height: 1.8;

    text-shadow:
        0 1px 2px #000;
}


/* =========================================================
   UNIT SMALL
========================================================= */

.unit-small {
    margin-top: 4px;

    color: #6c7680;

    font-size: 11px;
}


/* =========================================================
   NORMAL INPUT + SELECT
========================================================= */

.normal-input,
select {
    width: 100%;

    padding: 14px;

    border-radius: 12px;

    border:
        1px solid #343b44;

    outline: none;

    background:
        linear-gradient(
            145deg,
            #171b20,
            #0b0d10
        );

    color: var(--white);

    font-family:
        Tahoma,
        Arial,
        sans-serif;

    box-shadow:
        inset 3px 3px 7px rgba(0,0,0,.55),
        inset -2px -2px 4px rgba(255,255,255,.025),
        0 5px 15px rgba(0,0,0,.25);

    transition:
        all .25s ease;
}


.normal-input:hover,
select:hover {
    border-color:
        rgba(0,197,237,.35);

    transform:
        translateY(-1px);
}


.normal-input:focus,
select:focus {
    transform:
        translateY(-2px);

    border-color:
        var(--ocean-light);

    box-shadow:
        inset 3px 3px 7px rgba(0,0,0,.6),
        0 8px 22px rgba(0,0,0,.4),
        0 0 20px rgba(0,197,237,.12);
}


/* گزینه‌های Select */

select option {
    background:
        #101419;

    color:
        var(--white);
}


/* =========================================================
   BUTTONS
========================================================= */

.buttons {
    display: flex;

    gap: 14px;

    margin-top: 28px;

    flex-wrap: wrap;
}


button {
    position: relative;

    border: none;

    border-radius: 13px;

    padding:
        14px 25px;

    color:
        var(--white);

    font-family:
        Tahoma,
        Arial,
        sans-serif;

    font-size: 15px;

    font-weight: bold;

    cursor: pointer;

    overflow: hidden;

    transform:
        translateY(0);

    transition:
        transform .2s ease,
        box-shadow .2s ease,
        filter .2s ease;
}


/* نور روی دکمه */

button::before {
    content: "";

    position: absolute;

    top: 1px;
    left: 12%;
    right: 12%;

    height: 1px;

    background:
        rgba(255,255,255,.22);

    pointer-events: none;
}


button:hover {
    transform:
        translateY(-4px);

    filter:
        brightness(1.12);
}


button:active {
    transform:
        translateY(1px);

    box-shadow:
        inset 0 4px 8px rgba(0,0,0,.45);
}


/* =========================================================
   SAVE BUTTON
========================================================= */

.save-btn {
    background:
        linear-gradient(
            145deg,
            #079fc5,
            #00627e 55%,
            #003e50
        );

    border:
        1px solid rgba(18,197,237,.5);

    box-shadow:
        0 9px 20px rgba(0,0,0,.45),
        0 0 18px rgba(0,124,159,.18),
        inset 0 1px 0 rgba(255,255,255,.18);
}


.save-btn:hover {
    box-shadow:
        0 14px 28px rgba(0,0,0,.55),
        0 0 28px rgba(18,197,237,.25),
        inset 0 1px 0 rgba(255,255,255,.2);
}


/* =========================================================
   RESET BUTTON
========================================================= */

.reset-btn {
    background:
        linear-gradient(
            145deg,
            #d41538,
            #930019 55%,
            #5b000f
        );

    border:
        1px solid rgba(226,26,59,.5);

    box-shadow:
        0 9px 20px rgba(0,0,0,.45),
        0 0 18px rgba(169,0,32,.16),
        inset 0 1px 0 rgba(255,255,255,.14);
}


.reset-btn:hover {
    box-shadow:
        0 14px 28px rgba(0,0,0,.55),
        0 0 28px rgba(226,26,59,.22),
        inset 0 1px 0 rgba(255,255,255,.16);
}


/* =========================================================
   HOME BUTTON
========================================================= */

.home-btn {
    background:
        linear-gradient(
            145deg,
            #343b44,
            #20252b 55%,
            #11151a
        );

    border:
        1px solid #49525d;

    box-shadow:
        0 9px 20px rgba(0,0,0,.45),
        inset 0 1px 0 rgba(255,255,255,.10);
}


.home-btn:hover {
    box-shadow:
        0 14px 28px rgba(0,0,0,.55),
        0 0 18px rgba(255,255,255,.06);
}


/* =========================================================
   SUCCESS
========================================================= */

.success {
    display: none;

    position: relative;

    padding: 16px 18px;

    margin-top: 22px;

    border-radius: 13px;

    color: #c8f6ff;

    background:
        linear-gradient(
            145deg,
            rgba(0,124,159,.20),
            rgba(5,20,26,.85)
        );

    border:
        1px solid rgba(18,197,237,.20);

    border-right:
        4px solid var(--ocean-light);

    box-shadow:
        0 12px 30px rgba(0,0,0,.35),
        inset 0 1px 0 rgba(255,255,255,.05),
        0 0 20px rgba(0,124,159,.08);
}


/* =========================================================
   LINKS
========================================================= */

a {
    color:
        var(--ocean-light);

    text-decoration:
        none;

    transition:
        .2s;
}


a:hover {
    color:
        #ffffff;

    text-shadow:
        0 0 10px rgba(18,197,237,.35);
}


/* =========================================================
   HR
========================================================= */

hr {
    border: none;

    height: 1px;

    margin:
        25px 0;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(0,197,237,.35),
            rgba(169,0,32,.35),
            transparent
        );
}


/* =========================================================
   SCROLLBAR
========================================================= */

::-webkit-scrollbar {
    width: 10px;
}

::-webkit-scrollbar-track {
    background:
        #050608;
}

::-webkit-scrollbar-thumb {
    border-radius: 10px;

    background:
        linear-gradient(
            180deg,
            var(--ocean),
            var(--blood)
        );

    border:
        2px solid #050608;
}

::-webkit-scrollbar-thumb:hover {
    background:
        linear-gradient(
            180deg,
            var(--ocean-light),
            var(--blood-light)
        );
}


/* =========================================================
   TEXT SELECTION
========================================================= */

::selection {
    background:
        var(--blood);

    color:
        #ffffff;
}


/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 900px) {

    .form-grid {
        grid-template-columns:
            repeat(2, 1fr);
    }

    .card {
        padding: 21px;
    }

    .box {
        padding: 24px;
    }
}


@media (max-width: 600px) {

    body {
        background-attachment:
            scroll;
    }

    .container {
        width: 95%;

        margin-top: 20px;
    }

    .header {
        padding:
            30px 15px;
    }

    .header h1 {
        font-size: 22px;
    }

    .header p {
        font-size: 12px;
    }

    .box {
        padding: 16px;

        border-radius: 18px;
    }

    .card {
        padding: 18px;

        border-radius: 16px;
    }

    .form-grid {
        grid-template-columns:
            1fr;

        gap: 17px;
    }

    .buttons {
        flex-direction:
            column;
    }

    button {
        width: 100%;
    }

    .section-title {
        font-size: 18px;
    }

    .money-input {
        font-size: 15px;
    }
}


/* =========================================================
   REDUCED MOTION
========================================================= */

@media (prefers-reduced-motion: reduce) {

    *,
    *::before,
    *::after {
        scroll-behavior: auto !important;

        transition:
            none !important;
    }
}

</style>
